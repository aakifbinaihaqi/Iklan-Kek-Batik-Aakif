<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background-color:bisque;
    font-family:Arial, Helvetica, sans-serif;
}

/* Banner */

.banner{
    background-color:#f6d8a8;
    padding:25px;
    text-align:center;
}

.banner h1{
    color:brown;
    font-size:70px;
}

/* Kandungan */

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
    padding:50px;
    flex-wrap:wrap;
}

.Gambarkekbatik{
    width:450px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.text{
    max-width:600px;
}

.text h2{
    color:brown;
    font-size:45px;
    margin-bottom:20px;
}

.text ul{
    font-size:30px;
    line-height:2;
}

/* Button */

.Button{
    margin-top:30px;
    background-color:brown;
    color:white;
    border:none;
    border-radius:15px;
    padding:18px 35px;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.Button:hover{
    background-color:#5a1d1d;
    transform:scale(1.05);
}

</style>

</head>

<body>

<div class="banner">
    <h1> KEK BATIK </h1>
</div>

<div class="container">

    <img class="Gambarkekbatik" src="Kekbatik.jpeg">

    <div class="text">

        <h2>Mengapa Kek Batik Kami Sangat Sedap?</h2>

        <ul>
            <li>Menggunakan coklat premium.</li>
            <li>Menggunakan bahan-bahan segar.</li>
            <li>Dibuat dengan penuh kasih sayang.</li>
            <li>Aroma butter yang memikat selera.</li>
            <li>Rasa yang lembut dan tidak terlalu manis.</li>
        </ul>

        <a href="https://wa.me/60142714467">
            <button class="Button">📱 Tempah Sekarang</button>
        </a>

    </div>

</div>

</body>
</html>
